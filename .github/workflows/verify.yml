name: Verificar pacote Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:distribution
      - name: Gerar ZIP pelo manifesto
        shell: pwsh
        run: |
          $releaseFolder = node scripts/export.mjs
          if ($LASTEXITCODE -ne 0) { throw 'A exportacao falhou.' }
          & ./scripts/zip-release.ps1 -ReleaseFolder $releaseFolder.Trim()
      - uses: actions/upload-artifact@v7
        with:
          name: monitor-codex-local-windows
          path: |
            release/monitor-codex-local-v*-windows.zip
            release/monitor-codex-local-v*-windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
